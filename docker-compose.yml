# app --OTLP--> otel-collector --> jaeger     (traces)
#                              --> prometheus (metrics)
#                              --> loki       (logs)
#                grafana reads all three and links them by trace_id.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (the app sends here)
      - "4318:4318" # OTLP HTTP
    depends_on: [jaeger, prometheus, loki]

  jaeger:
    image: jaegertracing/jaeger:2.3.0
    ports:
      - "16686:16686" # UI. Its OTLP port stays internal: only the Collector talks to it.

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on: [jaeger, prometheus, loki]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: otel
      POSTGRES_PASSWORD: otel
      POSTGRES_DB: orders
    ports:
      - "5434:5432" # 5433 is taken by another project's Postgres on this machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otel -d orders"]
      interval: 2s
      retries: 15
