# app --OTLP:4317--> otel-collector (Datadog exporter) --> Datadog
#                                       traces  -> APM
#                                       metrics -> Metrics
#                                       logs    -> Logs
#
# Needs DD_API_KEY (and DD_SITE) in .env. See .env.example.
services:
  # The OpenTelemetry Collector (contrib build, which includes the Datadog
  # exporter and connector). It receives OTLP from the app and sends all
  # three signals to Datadog. Config: deploy/otel-collector.yaml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      DD_API_KEY: ${DD_API_KEY:?set DD_API_KEY in .env}
      DD_SITE: ${DD_SITE:-datadoghq.com} # e.g. datadoghq.eu, us5.datadoghq.com
    ports:
      - "4317:4317" # OTLP gRPC (the app sends here)
      - "4318:4318" # OTLP HTTP

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: otel
      POSTGRES_PASSWORD: otel
      POSTGRES_DB: orders
    ports:
      - "5434:5432" # 5433 is taken by another project's Postgres on this machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otel -d orders"]
      interval: 2s
      retries: 15
