# Nothing to scrape: the Collector pushes metrics in over OTLP.
global:
  evaluation_interval: 15s

otlp:
  # Copy these resource attributes onto every series as labels, so you can
  # filter with {deployment_environment="dev"} instead of joining target_info.
  promote_resource_attributes:
    - service.name
    - deployment.environment

storage:
  tsdb:
    # Accept OTLP points slightly out of order (they arrive in batches).
    out_of_order_time_window: 30m
